name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ── CI: runs on every push and PR ─────────────────────────────────────────
  ci:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: BDD tests (Cucumber)
        run: npm run test:bdd

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e

  # ── CD: deploy to Netlify only on push to main ────────────────────────────
  deploy:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GDRIVE_FOLDER_NAME: ${{ secrets.VITE_GDRIVE_FOLDER_NAME }}
          VITE_GDRIVE_FLASHCARDS_FOLDER: ${{ secrets.VITE_GDRIVE_FLASHCARDS_FOLDER }}
          VITE_GDRIVE_SR_STATE_FILE: ${{ secrets.VITE_GDRIVE_SR_STATE_FILE }}

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=dist --prod --message "Deploy from GitHub Actions (${{ github.sha }})"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ── Preview: deploy PR previews to Netlify ────────────────────────────────
  preview:
    name: Deploy PR Preview to Netlify
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GDRIVE_FOLDER_NAME: ${{ secrets.VITE_GDRIVE_FOLDER_NAME }}
          VITE_GDRIVE_FLASHCARDS_FOLDER: ${{ secrets.VITE_GDRIVE_FLASHCARDS_FOLDER }}
          VITE_GDRIVE_SR_STATE_FILE: ${{ secrets.VITE_GDRIVE_SR_STATE_FILE }}

      - name: Deploy preview to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=dist --message "PR #${{ github.event.number }} preview"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
